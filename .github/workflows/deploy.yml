# Majapi reusable CI/CD: detects the app type, then runs the static (S3 + CloudFront)
# or container path (boxes + Pulumi, see README). Repos with nothing to deploy
# skip every deploy job.
name: Majapi Deploy

on:
  workflow_call:
    inputs:
      deploy_production:
        description: Force a production deploy (workflow_dispatch).
        type: boolean
        default: false
      cleanup_preview_pr:
        description: Container repos only. PR number whose preview to remove, or "shared" to destroy the shared preview stack.
        type: string
        default: ""
      ci_ref:
        description: Ref of majapisoftwares/ci whose scripts this run uses; matches the major tag.
        type: string
        default: v2
    secrets:
      HOSTED_ENV:
        description: "Hosted apps only. The runtime env, for callers outside the organization (secrets: inherit passes nothing there); otherwise the secret named by hosted.envSecret is used."
        required: false
    outputs:
      type:
        description: Detected app type (static, container or none).
        value: ${{ jobs.detect.outputs.type }}

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      type: ${{ steps.detect.outputs.type }}
      framework: ${{ steps.detect.outputs.framework }}
      build_dir: ${{ steps.detect.outputs.build_dir }}
      # "container" only when .majapi/ci.json configures boxes and Pulumi.
      container: ${{ steps.detect.outputs.container }}
      container_preview: ${{ steps.detect.outputs.container_preview }}
      release_after_pulumi: ${{ steps.detect.outputs.release_after_pulumi }}
      hosted: ${{ steps.detect.outputs.hosted }}
      production: ${{ steps.events.outputs.production }}
      preview: ${{ steps.events.outputs.preview }}
      cleanup: ${{ steps.events.outputs.cleanup }}
      preview_slug: ${{ steps.events.outputs.preview_slug }}
      preview_url: ${{ steps.events.outputs.preview_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: majapisoftwares/ci
          ref: ${{ inputs.ci_ref }}
          path: .majapi-ci
      - id: detect
        run: |
          node .majapi-ci/scripts/detect.mjs . >> "$GITHUB_OUTPUT"
          {
            echo "container=$(node -p 'try { Boolean(require("./.majapi/ci.json").container) } catch { false }')"
            echo "container_preview=$(node -p 'try { Boolean(require("./.majapi/ci.json").container.preview) } catch { false }')"
            echo "release_after_pulumi=$(node -p 'try { Boolean(require("./.majapi/ci.json").container.production.releaseAfterPulumi) } catch { false }')"
            echo "hosted=$(node -p 'try { Boolean(require("./.majapi/ci.json").hosted) } catch { false }')"
          } >> "$GITHUB_OUTPUT"
      - id: events
        env:
          DEFAULT_BRANCH_PUSH: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          FORCED: ${{ inputs.deploy_production }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
          PR_ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_NAME: ${{ github.event.repository.name }}
          PREVIEW_BASE_DOMAIN: ${{ vars.PREVIEW_BASE_DOMAIN || 'preview.majapi.com' }}
        run: |
          production=false; preview=false; cleanup=false
          if [ "$DEFAULT_BRANCH_PUSH" = true ] || [ "$FORCED" = true ]; then production=true; fi
          if [ "$IS_PR" = true ] && [ "$PR_ACTION" != closed ]; then preview=true; fi
          if [ "$IS_PR" = true ] && [ "$PR_ACTION" = closed ]; then cleanup=true; fi
          printf 'production=%s\npreview=%s\ncleanup=%s\n' "$production" "$preview" "$cleanup" >> "$GITHUB_OUTPUT"
          if [ "$IS_PR" = true ]; then
            # One DNS label: pr-<n>-<repo>, lowercase, at most 63 characters.
            slug=$(printf 'pr-%s-%s' "$PR_NUMBER" "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9-' '-' | cut -c1-63 | sed 's/-*$//')
            printf 'preview_slug=%s\npreview_url=https://%s.%s\n' "$slug" "$slug" "$PREVIEW_BASE_DOMAIN" >> "$GITHUB_OUTPUT"
          fi
      - run: echo "Detected ${{ steps.detect.outputs.type }} (${{ steps.detect.outputs.framework }})" >> "$GITHUB_STEP_SUMMARY"

  # ---------- Static Web App (S3 + CloudFront) ----------

  static_preview:
    needs: detect
    if: needs.detect.outputs.type == 'static' && needs.detect.outputs.preview == 'true'
    runs-on: ubuntu-latest
    # Previews share one bucket served at <slug>.<PREVIEW_BASE_DOMAIN> (org variables).
    env:
      BUILD_DIR: ${{ vars.STATIC_BUILD_DIR || needs.detect.outputs.build_dir }}
      PREVIEW_BUCKET: ${{ vars.PREVIEW_BUCKET }}
      SLUG: ${{ needs.detect.outputs.preview_slug }}
      PREVIEW_URL: ${{ needs.detect.outputs.preview_url }}
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    environment:
      name: preview-pr-${{ github.event.pull_request.number }}
      url: ${{ needs.detect.outputs.preview_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: majapisoftwares/ci
          ref: ${{ inputs.ci_ref }}
          path: .majapi-ci
      - run: node .majapi-ci/scripts/preview-comment.mjs building "$PREVIEW_URL"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.PREVIEW_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Upload preview
        run: aws s3 sync "$BUILD_DIR" "s3://$PREVIEW_BUCKET/$SLUG" --delete
      - run: node .majapi-ci/scripts/preview-comment.mjs ready "$PREVIEW_URL"
      - if: failure()
        run: node .majapi-ci/scripts/preview-comment.mjs failed "$PREVIEW_URL"

  static_cleanup:
    needs: detect
    if: needs.detect.outputs.type == 'static' && needs.detect.outputs.cleanup == 'true'
    runs-on: ubuntu-latest
    env:
      PREVIEW_BUCKET: ${{ vars.PREVIEW_BUCKET }}
      SLUG: ${{ needs.detect.outputs.preview_slug }}
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: majapisoftwares/ci
          ref: ${{ inputs.ci_ref }}
          path: .majapi-ci
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.PREVIEW_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - run: aws s3 rm "s3://$PREVIEW_BUCKET/$SLUG" --recursive
      - run: node .majapi-ci/scripts/preview-comment.mjs removed "${{ needs.detect.outputs.preview_url }}"

  static_production:
    needs: detect
    if: needs.detect.outputs.type == 'static' && needs.detect.outputs.production == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.repository }}-production
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      BUILD_DIR: ${{ vars.STATIC_BUILD_DIR || needs.detect.outputs.build_dir }}
      S3_BUCKET: ${{ vars.CATALOG_BUCKET || vars.STATIC_APP_BUCKET }}
      ROLE_ARN: ${{ vars.CATALOG_DEPLOY_ROLE_ARN || vars.AWS_DEPLOY_ROLE_ARN }}
      DISTRIBUTION_ID: ${{ vars.CATALOG_DISTRIBUTION_ID || vars.CLOUDFRONT_DISTRIBUTION_ID }}
    environment:
      name: production
      url: ${{ vars.PUBLIC_APP_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - if: env.ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Upload to S3
        if: env.ROLE_ARN != '' && env.S3_BUCKET != ''
        run: |
          aws s3 sync "$BUILD_DIR" "s3://$S3_BUCKET" --delete --exclude "previews/*" --exclude "*.html" --exclude "*.txt" --exclude release.json --cache-control "public,max-age=31536000,immutable"
          cd "$BUILD_DIR"
          find . \( -name "*.html" -o -name "*.txt" -o -name release.json \) | sed 's#^./##' | while read -r file; do
            key="$file"
            case "$file" in
              index.html|*/index.html) ;;
              *.html) key="${file%.html}" ;;
            esac
            case "$file" in *.html) type=text/html;; *.txt) type=text/plain;; *) type=application/json;; esac
            aws s3 cp "$file" "s3://$S3_BUCKET/$key" --content-type "$type" --cache-control "no-cache"
          done
      - name: Invalidate CDN
        if: env.ROLE_ARN != '' && env.DISTRIBUTION_ID != ''
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"

  # ---------- Container (boxes + Pulumi, configured by .majapi/ci.json `container`) ----------
  #
  # Production: compiled releases deploy straight to the production box; changes
  # the classifier marks as full (infra, Dockerfile, ...) run `pulumi up`.
  # Previews: a shared preview box hosts every PR. Fast previews ship source,
  # compiled previews ship a build, full previews get their own Pulumi stack.
  # The preview-shared stack is destroyed when no open PR needs it and provisioned again on the next preview.

  container_build:
    needs: detect
    if: needs.detect.outputs.type == 'container' && needs.detect.outputs.container != 'true' && needs.detect.outputs.hosted != 'true' && (needs.detect.outputs.preview == 'true' || needs.detect.outputs.production == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: echo 'Built only; add a container block to .majapi/ci.json to deploy.' >> "$GITHUB_STEP_SUMMARY"

  container_classify:
    needs: detect
    if: needs.detect.outputs.container == 'true' && (needs.detect.outputs.preview == 'true' || (github.event_name == 'push' && needs.detect.outputs.production == 'true'))
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
      reason: ${{ steps.classify.outputs.reason }}
      requires_full: ${{ steps.classify.outputs.requires_full }}
      run_migrations: ${{ steps.classify.outputs.run_migrations }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: majapisoftwares/ci
          ref: ${{ inputs.ci_ref }}
          path: .majapi-ci
      - id: classify
        env:
          # On PR updates, classify only what changed since the previous preview.
          BASE: ${{ github.event_name == 'push' && format('{0}^', github.sha) || (github.event.action == 'synchronize' && github.event.before || github.event.pull_request.base.sha) }}
          FALLBACK_BASE: ${{ github.event.pull_request.base.sha || format('{0}^', github.sha) }}
          PREVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PREVIEW_LABELS_JSON: ${{ github.event_name == 'push' && '[]' || toJson(github.event.pull_request.labels.*.name) }}
        run: |
          set -eu
          PREVIEW_BASE_SHA="$BASE"
          git cat-file -e "${PREVIEW_BASE_SHA}^{commit}" 2>/dev/null || PREVIEW_BASE_SHA="$FALLBACK_BASE"
          export PREVIEW_BASE_SHA
          # The app's own classifier wins (it knows its runtime layout).
          CLASSIFIER="$(node -p 'require("./.majapi/ci.json").container.classifier || ""')"
          [ -n "$CLASSIFIER" ] || CLASSIFIER=.majapi-ci/scripts/classify-preview-deploy.mjs
          RESULT="$(node "$CLASSIFIER")"
          for key in mode reason requiresFull runMigrations; do
            name="$(printf '%s' "$key" | sed 's/[A-Z]/_\L&/g')"
            echo "${name}=$(node -p "String(JSON.parse(process.argv[1]).${key})" "$RESULT")" >> "$GITHUB_OUTPUT"
          done
          echo "Classified as $(node -p 'JSON.parse(process.argv[1]).mode' "$RESULT")"

  container_production_full:
    needs: [detect, container_classify]
    if: always() && needs.detect.outputs.container == 'true' && ((github.event_name == 'push' && needs.detect.outputs.production == 'true' && needs.container_classify.outputs.requires_full == 'true') || (github.event_name == 'workflow_dispatch' && inputs.deploy_production))
    runs-on: ${{ vars.AWS_BUILD_RUNNER || 'ubuntu-latest' }}
    concurrency:
      group: pulumi-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ steps.pulumi.outputs.appUrl }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: majapisoftwares/ci
          ref: ${{ inputs.ci_ref }}
          path: .majapi-ci
      - id: cfg
        env:
          VARS_JSON: ${{ toJson(vars) }}
          SECRETS_JSON: ${{ toJson(secrets) }}
          CTX_STACK: production
          CTX_ENVIRONMENT: production
          CTX_DEPLOYMENT_ENVIRONMENT: production
          CTX_GIT_SHA: ${{ github.sha }}
        run: |
          export CTX_IMAGE_TAG="${GITHUB_SHA::12}"
          node .majapi-ci/scripts/container/config.mjs pulumi production
          node .majapi-ci/scripts/container/config.mjs values production
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ steps.cfg.outputs.work_dir }}/package-lock.json
      - run: npm ci
        working-directory: ${{ steps.cfg.outputs.work_dir }}
      - name: Reclaim runner disk for the image build
        if: vars.AWS_BUILD_RUNNER == ''
        run: |
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          docker system prune --all --force || true
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'sa-east-1' }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.pulumi/plugins
            ~/.pulumi/policies
          key: ${{ runner.os }}-pulumi-${{ hashFiles(format('{0}/package-lock.json', steps.cfg.outputs.work_dir)) }}
          restore-keys: ${{ runner.os }}-pulumi-
      - run: sh .majapi-ci/scripts/container/pulumi-state.sh clear-lock "${{ vars.PULUMI_STATE_BUCKET }}" "${{ steps.cfg.outputs.project }}" production
      - id: pulumi
        uses: pulumi/actions@v7
        with:
          cloud-url: s3://${{ vars.PULUMI_STATE_BUCKET }}
          command: up
          comment-on-summary: true
          config-map: ${{ steps.cfg.outputs.config_map }}
          refresh: true
          stack-name: production
          upsert: true
          work-dir: ${{ steps.cfg.outputs.work_dir }}
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}

  container_production_compiled:
    needs: [detect, container_classify, container_production_full]
    if: >-
      always() && needs.detect.outputs.container == 'true' && needs.detect.outputs.production == 'true' &&
      needs.container_production_full.result != 'failure' && needs.container_production_full.result != 'cancelled' &&
      ((github.event_name == 'push' && needs.container_classify.result == 'success' && needs.container_classify.outputs.requires_full != 'true') ||
      (needs.detect.outputs.release_after_pulumi == 'true' && needs.container_production_full.result == 'success'))
    runs-on: ${{ vars.AWS_BUILD_RUNNER || 'ubuntu-latest' }}
    concurrency:
      group: pulumi-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: majapisoftwares/ci
          ref: ${{ inputs.ci_ref }}
          path: .majapi-ci
      - id: cfg
        env:
          VARS_JSON: ${{ toJson(vars) }}
          CTX_ENVIRONMENT: production
        run: node .majapi-ci/scripts/container/config.mjs values production
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: ${{ steps.cfg.outputs.buildCommand || 'npm run build' }}
        env:
          NEXT_DEPLOYMENT_ID: ${{ github.sha }}
          NODE_OPTIONS: --max-old-space-size=4096
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'sa-east-1' }}
      - id: deploy
        env:
          ENVIRONMENT_NAME: production
          DOMAINS: ${{ steps.cfg.outputs.domains }}
          BOX: ${{ steps.cfg.outputs.box }}
          SECRET_PREFIX: ${{ steps.cfg.outputs.runtimeSecretPrefix }}
          ARTIFACT_BUCKET: ${{ vars.PULUMI_STATE_BUCKET }}
          APP_ROOT: ${{ steps.cfg.outputs.appRoot }}
          DEPLOY_SCRIPT: ${{ steps.cfg.outputs.deployScript }}
          RUNTIME_HASH_FILE: ${{ steps.cfg.outputs.runtimeHashFile }}
          RUN_MIGRATIONS: ${{ needs.container_classify.outputs.run_migrations || 'false' }}
          CPU: ${{ steps.cfg.outputs.cpu }}
          MEMORY: ${{ steps.cfg.outputs.memory }}
          SHIP_DEPENDENCIES: ${{ steps.cfg.outputs.shipDependencies || 'true' }}
        run: |
          set -euo pipefail
          url=$(sh .majapi-ci/scripts/container/publish-release.sh | tail -n 1)
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Verify production
        # New boxes obtain their first HTTPS certificate after Caddy starts.
        run: curl -fsSL --retry 18 --retry-all-errors --retry-delay 5 --max-time 15 "${{ steps.deploy.outputs.url }}${{ steps.cfg.outputs.healthPath }}" >/dev/null

  container_preview_shared:
    needs: detect
    if: needs.detect.outputs.container_preview == 'true' && needs.detect.outputs.preview == 'true' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: pulumi-preview-shared
      cancel-in-progress: false
    environment:
      name: preview-pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: majapisoftwares/ci
          ref: ${{ inputs.ci_ref }}
          path: .majapi-ci
      - id: cfg
        env:
          VARS_JSON: ${{ toJson(vars) }}
          CTX_PR_NUMBER: ${{ github.event.pull_request.number }}
          CTX_ENVIRONMENT: pr-${{ github.event.pull_request.number }}
        run: node .majapi-ci/scripts/container/config.mjs values preview
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'sa-east-1' }}
      # A stopped box is started, not treated as missing.
      - run: sh .majapi-ci/scripts/container/box.sh start "${{ steps.cfg.outputs.box }}"
      - id: shared
        env:
          BOX: ${{ steps.cfg.outputs.box }}
          SECRET_PREFIX: ${{ steps.cfg.outputs.runtimeSecretPrefix }}
          CACHE_REPOSITORY: ${{ steps.cfg.outputs.buildCacheRepository }}
        run: |
          set -eu
          ready=true
          ID="$(sh .majapi-ci/scripts/container/box.sh id "$BOX")"
          { [ -n "$ID" ] && [ "$ID" != None ]; } || ready=false
          [ "$(aws secretsmanager list-secrets --filters "Key=name,Values=${SECRET_PREFIX}" --query 'length(SecretList)' --output text)" -gt 0 ] || ready=false
          if [ -n "$CACHE_REPOSITORY" ]; then
            aws ecr describe-repositories --repository-names "$CACHE_REPOSITORY" >/dev/null 2>&1 || ready=false
          fi
          echo "provision=$([ "$ready" = true ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
      - id: pulumi_cfg
        if: steps.shared.outputs.provision == 'true'
        env:
          VARS_JSON: ${{ toJson(vars) }}
          SECRETS_JSON: ${{ toJson(secrets) }}
          CTX_STACK: preview-shared
          CTX_ENVIRONMENT: preview-shared
          CTX_DEPLOYMENT_ENVIRONMENT: preview-shared
          CTX_IMAGE_TAG: preview-shared
          CTX_GIT_SHA: ${{ github.sha }}
        run: node .majapi-ci/scripts/container/config.mjs pulumi previewShared
      - if: steps.shared.outputs.provision == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ steps.pulumi_cfg.outputs.work_dir }}/package-lock.json
      - if: steps.shared.outputs.provision == 'true'
        run: npm ci
        working-directory: ${{ steps.pulumi_cfg.outputs.work_dir }}
      - if: steps.shared.outputs.provision == 'true'
        run: sh .majapi-ci/scripts/container/pulumi-state.sh clear-lock "${{ vars.PULUMI_STATE_BUCKET }}" "${{ steps.pulumi_cfg.outputs.project }}" preview-shared
      - if: steps.shared.outputs.provision == 'true'
        uses: pulumi/actions@v7
        with:
          cloud-url: s3://${{ vars.PULUMI_STATE_BUCKET }}
          command: up
          comment-on-summary: true
          config-map: ${{ steps.pulumi_cfg.outputs.config_map }}
          refresh: true
          stack-name: preview-shared
          upsert: true
          work-dir: ${{ steps.pulumi_cfg.outputs.work_dir }}
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
      - if: steps.shared.outputs.provision == 'true'
        run: sh .majapi-ci/scripts/container/box.sh start "${{ steps.cfg.outputs.box }}"

  container_preview_fast:
    needs: [detect, container_classify, container_preview_shared]
    if: needs.container_classify.result == 'success' && needs.container_preview_shared.result == 'success' && (needs.container_classify.outputs.mode == 'fast' || needs.container_classify.outputs.mode == 'both')
    runs-on: ubuntu-latest
    concurrency:
      group: fast-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    environment:
      name: preview-pr-${{ github.event.pull_request.number }}
      url: https://${{ steps.cfg.outputs.publicDomain }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: majapisoftwares/ci
          ref: ${{ inputs.ci_ref }}
          path: .majapi-ci
      - id: cfg
        env:
          VARS_JSON: ${{ toJson(vars) }}
          CTX_PR_NUMBER: ${{ github.event.pull_request.number }}
          CTX_ENVIRONMENT: pr-${{ github.event.pull_request.number }}
        run: node .majapi-ci/scripts/container/config.mjs values preview
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'sa-east-1' }}
      - env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BOX: ${{ steps.cfg.outputs.box }}
          SECRET_PREFIX: ${{ steps.cfg.outputs.runtimeSecretPrefix }}
          ARTIFACT_BUCKET: ${{ vars.PULUMI_STATE_BUCKET }}
          FAST_ROOT: ${{ steps.cfg.outputs.fastRoot }}
          FAST_SCRIPT: ${{ steps.cfg.outputs.fastScript }}
          PUBLIC_DOMAIN: ${{ steps.cfg.outputs.publicDomain }}
          APP_DOMAIN: ${{ steps.cfg.outputs.appDomain }}
          RUN_MIGRATIONS: ${{ needs.container_classify.outputs.run_migrations }}
        run: sh .majapi-ci/scripts/container/fast-preview.sh
      - run: python3 .majapi-ci/scripts/container/wait-https.py "https://${{ steps.cfg.outputs.publicDomain }}" "https://${{ steps.cfg.outputs.appDomain }}"
      - env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node .majapi-ci/scripts/preview-comment.mjs ready "https://${{ steps.cfg.outputs.publicDomain }}" "· [app](https://${{ steps.cfg.outputs.appDomain }}) · rápido · \`${GITHUB_SHA::7}\`"

  container_preview_compiled:
    needs: [detect, container_preview_shared]
    if: needs.container_preview_shared.result == 'success'
    runs-on: ${{ vars.AWS_BUILD_RUNNER || 'ubuntu-latest' }}
    concurrency:
      group: compiled-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    environment:
      name: preview-pr-${{ github.event.pull_request.number }}
      url: https://${{ steps.cfg.outputs.publicDomain }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: majapisoftwares/ci
          ref: ${{ inputs.ci_ref }}
          path: .majapi-ci
      - id: cfg
        env:
          VARS_JSON: ${{ toJson(vars) }}
          CTX_PR_NUMBER: ${{ github.event.pull_request.number }}
          CTX_ENVIRONMENT: pr-${{ github.event.pull_request.number }}
        run: node .majapi-ci/scripts/container/config.mjs values preview
      - env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node .majapi-ci/scripts/preview-comment.mjs building "https://${{ steps.cfg.outputs.publicDomain }}"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: ${{ steps.cfg.outputs.buildCommand || 'npm run build' }}
        env:
          NEXT_DEPLOYMENT_ID: ${{ github.sha }}
          NODE_OPTIONS: --max-old-space-size=4096
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'sa-east-1' }}
      - run: sh .majapi-ci/scripts/container/box.sh start "${{ steps.cfg.outputs.box }}"
      # The app's start script runs the same idempotent migration gate, so the
      # compiled release doesn't wait for the classifier.
      - env:
          ENVIRONMENT_NAME: pr-${{ github.event.pull_request.number }}
          DOMAINS: ${{ steps.cfg.outputs.publicDomain }}, ${{ steps.cfg.outputs.appDomain }}
          BOX: ${{ steps.cfg.outputs.box }}
          SECRET_PREFIX: ${{ steps.cfg.outputs.runtimeSecretPrefix }}
          ARTIFACT_BUCKET: ${{ vars.PULUMI_STATE_BUCKET }}
          APP_ROOT: ${{ steps.cfg.outputs.appRoot }}
          DEPLOY_SCRIPT: ${{ steps.cfg.outputs.deployScript }}
          RUNTIME_HASH_FILE: ${{ steps.cfg.outputs.runtimeHashFile }}
          RUN_MIGRATIONS: "false"
          CPU: ${{ steps.cfg.outputs.cpu }}
          MEMORY: ${{ steps.cfg.outputs.memory }}
          APP_DOMAIN: ${{ steps.cfg.outputs.appDomain }}
          PUBLIC_DOMAIN: ${{ steps.cfg.outputs.publicDomain }}
        run: sh .majapi-ci/scripts/container/publish-release.sh
      - run: python3 .majapi-ci/scripts/container/wait-https.py "https://${{ steps.cfg.outputs.publicDomain }}" "https://${{ steps.cfg.outputs.appDomain }}"
      - env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node .majapi-ci/scripts/preview-comment.mjs ready "https://${{ steps.cfg.outputs.publicDomain }}" "· [app](https://${{ steps.cfg.outputs.appDomain }}) · compilado · \`${GITHUB_SHA::7}\`"
      - if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node .majapi-ci/scripts/preview-comment.mjs failed "https://${{ steps.cfg.outputs.publicDomain }}"

  container_preview_full:
    needs: [detect, container_classify, container_preview_shared, container_preview_fast, container_preview_compiled]
    if: always() && needs.container_classify.result == 'success' && needs.container_preview_shared.result == 'success' && needs.container_preview_compiled.result == 'success' && needs.container_classify.outputs.requires_full == 'true'
    runs-on: ${{ vars.AWS_BUILD_RUNNER || 'ubuntu-latest' }}
    concurrency:
      group: pulumi-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    environment:
      name: preview-pr-${{ github.event.pull_request.number }}
      url: ${{ steps.pulumi.outputs.appUrl }}
    steps:
      - name: Skip when the PR is no longer open
        id: open
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "open=$([ "$(gh pr view ${{ github.event.pull_request.number }} --repo "$GITHUB_REPOSITORY" --json state --jq .state)" = OPEN ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.open.outputs.open == 'true'
        uses: actions/checkout@v4
      - if: steps.open.outputs.open == 'true'
        uses: actions/checkout@v4
        with:
          repository: majapisoftwares/ci
          ref: ${{ inputs.ci_ref }}
          path: .majapi-ci
      - id: cfg
        if: steps.open.outputs.open == 'true'
        env:
          VARS_JSON: ${{ toJson(vars) }}
          SECRETS_JSON: ${{ toJson(secrets) }}
          CTX_PR_NUMBER: ${{ github.event.pull_request.number }}
          CTX_STACK: pr-${{ github.event.pull_request.number }}
          CTX_ENVIRONMENT: pr-${{ github.event.pull_request.number }}
          CTX_DEPLOYMENT_ENVIRONMENT: preview
          CTX_GIT_SHA: ${{ github.sha }}
        run: |
          export CTX_IMAGE_TAG="pr-${CTX_PR_NUMBER}-${GITHUB_SHA::12}"
          node .majapi-ci/scripts/container/config.mjs pulumi preview
          node .majapi-ci/scripts/container/config.mjs values preview
      - if: steps.open.outputs.open == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ steps.cfg.outputs.work_dir }}/package-lock.json
      - if: steps.open.outputs.open == 'true'
        run: npm ci
        working-directory: ${{ steps.cfg.outputs.work_dir }}
      - if: steps.open.outputs.open == 'true' && vars.AWS_BUILD_RUNNER == ''
        run: |
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          docker system prune --all --force || true
      - if: steps.open.outputs.open == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'sa-east-1' }}
      - if: steps.open.outputs.open == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.pulumi/plugins
            ~/.pulumi/policies
          key: ${{ runner.os }}-pulumi-${{ hashFiles(format('{0}/package-lock.json', steps.cfg.outputs.work_dir)) }}
          restore-keys: ${{ runner.os }}-pulumi-
      - if: steps.open.outputs.open == 'true'
        run: sh .majapi-ci/scripts/container/pulumi-state.sh clear-lock "${{ vars.PULUMI_STATE_BUCKET }}" "${{ steps.cfg.outputs.project }}" "pr-${{ github.event.pull_request.number }}"
      - id: pulumi
        if: steps.open.outputs.open == 'true'
        uses: pulumi/actions@v7
        with:
          cloud-url: s3://${{ vars.PULUMI_STATE_BUCKET }}
          command: up
          comment-on-summary: true
          config-map: ${{ steps.cfg.outputs.config_map }}
          refresh: true
          stack-name: pr-${{ github.event.pull_request.number }}
          upsert: true
          work-dir: ${{ steps.cfg.outputs.work_dir }}
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
      - name: Wait for the full preview
        if: steps.open.outputs.open == 'true'
        env:
          APP_URL: ${{ steps.pulumi.outputs.appUrl }}
        run: |
          set -eu
          [ -n "$APP_URL" ] || { echo "Pulumi did not return appUrl." >&2; exit 1; }
          for _ in $(seq 1 60); do
            curl -kfsSL "${APP_URL%/}${{ steps.cfg.outputs.healthPath }}" >/dev/null && exit 0
            sleep 10
          done
          echo "Full preview ${APP_URL} did not become ready." >&2
          exit 1
      - if: steps.open.outputs.open == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node .majapi-ci/scripts/preview-comment.mjs ready "${{ steps.pulumi.outputs.appUrl }}" "· completo · \`${GITHUB_SHA::7}\`"

  container_cleanup:
    needs: detect
    if: needs.detect.outputs.container_preview == 'true' && ((needs.detect.outputs.cleanup == 'true' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && inputs.cleanup_preview_pr != '' && inputs.cleanup_preview_pr != 'shared'))
    runs-on: ubuntu-latest
    concurrency:
      group: pulumi-preview-${{ github.event.pull_request.number || inputs.cleanup_preview_pr }}
      cancel-in-progress: true
    environment:
      name: preview-pr-${{ github.event.pull_request.number || inputs.cleanup_preview_pr }}
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.cleanup_preview_pr }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: majapisoftwares/ci
          ref: ${{ inputs.ci_ref }}
          path: .majapi-ci
      - id: cfg
        env:
          VARS_JSON: ${{ toJson(vars) }}
          CTX_PR_NUMBER: ${{ env.PR_NUMBER }}
          CTX_ENVIRONMENT: pr-${{ env.PR_NUMBER }}
        run: |
          case "$PR_NUMBER" in ''|*[!0-9]*) echo "cleanup_preview_pr must be a PR number." >&2; exit 1 ;; esac
          node .majapi-ci/scripts/container/config.mjs values preview
          echo "work_dir=$(node -p 'require("./.majapi/ci.json").container.pulumi?.workDir || "infra/pulumi"')" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'sa-east-1' }}
      - id: stack
        run: echo "exists=$(sh .majapi-ci/scripts/container/pulumi-state.sh exists "${{ vars.PULUMI_STATE_BUCKET }}" "pr-${PR_NUMBER}")" >> "$GITHUB_OUTPUT"
      - if: steps.stack.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ steps.cfg.outputs.work_dir }}/package-lock.json
      - if: steps.stack.outputs.exists == 'true'
        run: npm ci
        working-directory: ${{ steps.cfg.outputs.work_dir }}
      - if: steps.stack.outputs.exists == 'true'
        run: sh .majapi-ci/scripts/container/pulumi-state.sh clear-lock "${{ vars.PULUMI_STATE_BUCKET }}" "$(node -p 'require("./.majapi/ci.json").container.pulumi.project')" "pr-${PR_NUMBER}"
      - if: steps.stack.outputs.exists == 'true'
        uses: pulumi/actions@v7
        with:
          cloud-url: s3://${{ vars.PULUMI_STATE_BUCKET }}
          command: destroy
          remove: true
          stack-name: pr-${{ env.PR_NUMBER }}
          work-dir: ${{ steps.cfg.outputs.work_dir }}
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
      - if: steps.cfg.outputs.removeScript != ''
        run: sh .majapi-ci/scripts/container/remove-preview.sh "${{ steps.cfg.outputs.box }}" "${{ steps.cfg.outputs.removeScript }}" "$PR_NUMBER"
      - if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .majapi-ci/scripts/preview-comment.mjs removed ""

  container_find_expired:
    needs: detect
    if: needs.detect.outputs.container_preview == 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.cleanup_preview_pr == ''))
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
    environment:
      name: preview-pr-shared
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'sa-east-1' }}
      # Full preview stacks of PRs idle for a day are destroyed; the PR's next
      # push recreates them.
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 200 --json number,isCrossRepository,updatedAt > prs.json
          aws s3api list-objects-v2 --bucket "${{ vars.PULUMI_STATE_BUCKET }}" --prefix ".pulumi/stacks/" --query "Contents[].Key" --output json > stacks.json
          # shellcheck disable=SC2016 # JS template literals, not shell expansions
          node -e '
            const fs = require("node:fs");
            const stacks = new Set((JSON.parse(fs.readFileSync("stacks.json", "utf8")) ?? []).map((key) => key.match(/([^/]+)\.json$/)?.[1]));
            const cutoff = Date.now() - 24 * 60 * 60 * 1000;
            const expired = JSON.parse(fs.readFileSync("prs.json", "utf8"))
              .filter((pr) => !pr.isCrossRepository && Date.parse(pr.updatedAt) <= cutoff && stacks.has(`pr-${pr.number}`))
              .map((pr) => String(pr.number));
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify(expired)}\n`);
            console.log(`${expired.length} expired preview stack(s).`);
          '

  container_destroy_expired:
    needs: [detect, container_find_expired]
    if: needs.container_find_expired.outputs.matrix != '[]' && needs.container_find_expired.outputs.matrix != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJson(needs.container_find_expired.outputs.matrix) }}
    concurrency:
      group: pulumi-preview-${{ matrix.pr }}
      cancel-in-progress: false
    environment:
      name: preview-pr-${{ matrix.pr }}
    steps:
      - uses: actions/checkout@v4
      - id: cfg
        run: |
          echo "work_dir=$(node -p 'require("./.majapi/ci.json").container.pulumi?.workDir || "infra/pulumi"')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ steps.cfg.outputs.work_dir }}/package-lock.json
      - run: npm ci
        working-directory: ${{ steps.cfg.outputs.work_dir }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'sa-east-1' }}
      - uses: pulumi/actions@v7
        with:
          cloud-url: s3://${{ vars.PULUMI_STATE_BUCKET }}
          command: destroy
          remove: true
          stack-name: pr-${{ matrix.pr }}
          work-dir: ${{ steps.cfg.outputs.work_dir }}
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}

  # Destroys the whole preview-shared stack (box, disk, IP, DNS, cache) once no
  # open, non-draft PR needs it: after a PR closes, daily, or on a "shared"
  # cleanup dispatch. The next preview provisions it again with `pulumi up`.
  container_destroy_idle_shared:
    needs: [detect, container_cleanup]
    if: always() && needs.detect.outputs.container_preview == 'true' && (github.event_name == 'schedule' || needs.detect.outputs.cleanup == 'true' || (github.event_name == 'workflow_dispatch' && inputs.cleanup_preview_pr == 'shared'))
    runs-on: ubuntu-latest
    concurrency:
      group: pulumi-preview-shared
      cancel-in-progress: false
    environment:
      name: preview-pr-shared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: majapisoftwares/ci
          ref: ${{ inputs.ci_ref }}
          path: .majapi-ci
      - id: idle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          OPEN="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" --paginate \
            --jq "[.[] | select(.draft == false and .head.repo.full_name == \"${GITHUB_REPOSITORY}\")] | length" \
            | awk '{ total += $1 } END { print total + 0 }')"
          echo "${OPEN} open PR(s) need previews."
          {
            echo "idle=$([ "$OPEN" -eq 0 ] && echo true || echo false)"
            echo "work_dir=$(node -p 'require("./.majapi/ci.json").container.pulumi?.workDir || "infra/pulumi"')"
            echo "project=$(node -p 'require("./.majapi/ci.json").container.pulumi?.project || ""')"
          } >> "$GITHUB_OUTPUT"
      - if: steps.idle.outputs.idle == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'sa-east-1' }}
      - id: stack
        if: steps.idle.outputs.idle == 'true'
        run: echo "exists=$(sh .majapi-ci/scripts/container/pulumi-state.sh exists "${{ vars.PULUMI_STATE_BUCKET }}" preview-shared)" >> "$GITHUB_OUTPUT"
      - if: steps.stack.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ steps.idle.outputs.work_dir }}/package-lock.json
      - if: steps.stack.outputs.exists == 'true'
        run: npm ci
        working-directory: ${{ steps.idle.outputs.work_dir }}
      - if: steps.stack.outputs.exists == 'true'
        run: sh .majapi-ci/scripts/container/pulumi-state.sh clear-lock "${{ vars.PULUMI_STATE_BUCKET }}" "${{ steps.idle.outputs.project }}" preview-shared
      - if: steps.stack.outputs.exists == 'true'
        uses: pulumi/actions@v7
        with:
          cloud-url: s3://${{ vars.PULUMI_STATE_BUCKET }}
          command: destroy
          comment-on-summary: true
          remove: true
          stack-name: preview-shared
          work-dir: ${{ steps.idle.outputs.work_dir }}
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}

  # Apps on a Majapi Cloud shared host (.majapi/ci.json "hosted"): Cloud places
  # the release on the app's host and its agent installs it. Replaces one box per app.
  hosted_production:
    needs: detect
    if: needs.detect.outputs.hosted == 'true' && needs.detect.outputs.production == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: hosted-production-${{ github.repository }}
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ steps.release.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: majapisoftwares/ci
          ref: ${{ inputs.ci_ref }}
          path: .majapi-ci
      - id: cfg
        run: node .majapi-ci/scripts/hosted/config.mjs >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: ${{ steps.cfg.outputs.buildCommand }}
        env:
          NEXT_DEPLOYMENT_ID: ${{ github.sha }}
          NODE_OPTIONS: --max-old-space-size=4096
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'sa-east-1' }}
      - name: Store the runtime env in SSM
        if: steps.cfg.outputs.envSecret != ''
        env:
          APP: ${{ steps.cfg.outputs.app }}
          RUNTIME_ENV: ${{ secrets.HOSTED_ENV || secrets[steps.cfg.outputs.envSecret] }}
        run: |
          set -eu
          test -n "$RUNTIME_ENV" || { echo "Secret ${{ steps.cfg.outputs.envSecret }} is empty or missing." >&2; exit 1; }
          aws ssm put-parameter --name "/majapi/apps/${APP}/env" --type SecureString --overwrite --value "$RUNTIME_ENV" >/dev/null
      - id: release
        env:
          APP: ${{ steps.cfg.outputs.app }}
          CLOUD_URL: ${{ steps.cfg.outputs.cloudUrl }}
          DOMAIN: ${{ steps.cfg.outputs.domain }}
          # Cloud signs downloads from its own bucket; repos with their own state bucket set this.
          ARTIFACT_BUCKET: ${{ vars.HOSTED_ARTIFACT_BUCKET || vars.PULUMI_STATE_BUCKET }}
        run: |
          set -euo pipefail
          url=$(sh .majapi-ci/scripts/hosted/publish.sh | tail -n 1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Verify production
        run: curl -fsSL --retry 18 --retry-all-errors --retry-delay 5 --max-time 15 "${{ steps.release.outputs.url }}${{ steps.cfg.outputs.healthPath }}" >/dev/null
